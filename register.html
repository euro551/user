<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมัครสมาชิก</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1f2430;--muted:#6b7280;--border:#cfd4dc;--ok:#16a34a;--err:#dc2626;--btn:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--card:#1d2027;--text:#e8eaef;--muted:#9aa1ad;--border:#3a3f4a}}
:root[data-theme="dark"]{--bg:#14161b;--card:#1d2027;--text:#e8eaef;--muted:#9aa1ad;--border:#3a3f4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.5}
.banner{display:none;background:var(--ok);color:#fff;font-size:1.25rem;font-weight:700;text-align:center;padding:1rem}
.banner.show{display:block}
main{max-width:480px;margin:0 auto;padding:1.5rem 1rem}
.card{background:var(--card);border-radius:12px;padding:1.5rem;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{margin:0 0 1rem;font-size:1.4rem}
.row{display:flex;gap:.75rem}.row>div{flex:1;min-width:0}
.field{margin-bottom:1rem}
label{display:block;font-size:.9rem;margin-bottom:.25rem}
input[type=text],input[type=email],input[type=tel],input[type=password]{width:100%;padding:.65rem .75rem;font:inherit;color:var(--text);background:transparent;border:2px solid var(--border);border-radius:8px;outline:none}
input.valid{border-color:var(--ok)}
input.invalid{border-color:var(--err)}
.msg{color:var(--err);font-size:.85rem;min-height:1.1rem;margin-top:.2rem}
.terms{display:flex;gap:.5rem;align-items:center}
.terms.invalid{color:var(--err)}
button{width:100%;padding:.8rem;font:inherit;font-weight:700;color:#fff;background:var(--btn);border:0;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div id="banner" class="banner" role="status">ลงทะเบียนสำเร็จ</div>
<main>
<form id="f" class="card" novalidate>
<h1>สมัครสมาชิก</h1>
<div class="row">
<div class="field"><label for="first">ชื่อ</label><input type="text" id="first" autocomplete="given-name"><div class="msg" data-for="first"></div></div>
<div class="field"><label for="last">นามสกุล</label><input type="text" id="last" autocomplete="family-name"><div class="msg" data-for="last"></div></div>
</div>
<div class="field"><label for="email">อีเมล</label><input type="email" id="email" autocomplete="email"><div class="msg" data-for="email"></div></div>
<div class="field"><label for="phone">เบอร์โทรศัพท์</label><input type="tel" id="phone" inputmode="numeric" maxlength="10" autocomplete="tel"><div class="msg" data-for="phone"></div></div>
<div class="field"><label for="pw">รหัสผ่าน</label><input type="password" id="pw" autocomplete="new-password"><div class="msg" data-for="pw"></div></div>
<div class="field"><label for="pw2">ยืนยันรหัสผ่าน</label><input type="password" id="pw2" autocomplete="new-password"><div class="msg" data-for="pw2"></div></div>
<div class="field"><div class="terms" id="termsBox"><input type="checkbox" id="terms"><label for="terms" style="margin:0">ยอมรับเงื่อนไขการใช้งาน</label></div><div class="msg" data-for="terms"></div></div>
<button type="submit">สมัครสมาชิก</button>
</form>
</main>
<script>
const $=id=>document.getElementById(id);
const rules={
first:v=>v.trim()?"":"กรุณากรอกชื่อ",
last:v=>v.trim()?"":"กรุณากรอกนามสกุล",
email:v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())?"":"อีเมลไม่ถูกต้อง",
phone:v=>/^0\d{9}$/.test(v)?"":"เบอร์โทรต้องมี 10 หลักและขึ้นต้นด้วย 0",
pw:v=>v.length<8?"รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร":(/\d/.test(v)&&/[^\d]/.test(v)?"":"รหัสผ่านต้องมีทั้งตัวเลขและตัวอักษร"),
pw2:v=>v&&v===$("pw").value?"":"รหัสผ่านไม่ตรงกัน",
terms:()=>$("terms").checked?"":"กรุณายอมรับเงื่อนไขก่อนสมัคร"
};
const touched={};
function check(k,show=true){
  const el=$(k),err=rules[k](k==="terms"?"":el.value);
  const msg=document.querySelector('[data-for="'+k+'"]');
  if(show){
    msg.textContent=err;
    if(k==="terms"){$("termsBox").classList.toggle("invalid",!!err)}
    else{el.classList.toggle("invalid",!!err);el.classList.toggle("valid",!err)}
  }
  return !err;
}
Object.keys(rules).forEach(k=>{
  const ev=k==="terms"?"change":"input";
  $(k).addEventListener(ev,()=>{
    if(k==="phone")$(k).value=$(k).value.replace(/\D/g,"");
    touched[k]=true;check(k);
    if(k==="pw"&&touched.pw2)check("pw2");
    $("banner").classList.remove("show");
  });
});
$("f").addEventListener("submit",e=>{
  e.preventDefault();
  let ok=true;
  Object.keys(rules).forEach(k=>{touched[k]=true;if(!check(k))ok=false});
  if(ok){
    $("f").reset();
    document.querySelectorAll("input").forEach(i=>i.classList.remove("valid","invalid"));
    document.querySelectorAll(".msg").forEach(m=>m.textContent="");
    $("termsBox").classList.remove("invalid");
    Object.keys(touched).forEach(k=>delete touched[k]);
    $("banner").classList.add("show");
    window.scrollTo({top:0,behavior:"smooth"});
  }
});
</script>
</body>
</html>
